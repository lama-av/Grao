<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1a18">
  <title>Grão</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">
    <!-- Três camadas: riso (GPU) → interface (roda, chips, caixa da seleção) → traço molhado (recebe os toques) -->
    <div class="stage">
      <canvas id="gl"></canvas>
      <canvas id="ui" aria-label="Roda de canto: toque para abrir"></canvas>
      <canvas id="wet"></canvas>
    </div>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script>
    // Fase de testes: qualquer erro aparece numa caixa vermelha na tela (no tablet não há console à mão).
    (function () {
      function show(msg) {
        var box = document.getElementById('erros');
        if (!box) {
          box = document.createElement('pre');
          box.id = 'erros';
          box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;max-height:40vh;overflow:auto;' +
            'margin:0;padding:10px;background:#b00020;color:#fff;font:13px/1.4 monospace;white-space:pre-wrap;border-radius:6px';
          document.body.appendChild(box);
        }
        box.textContent += msg + '\n';
      }
      window.addEventListener('error', function (e) {
        show('ERRO: ' + e.message + (e.filename ? '\n  em ' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        show('ERRO (promessa): ' + (r && (r.stack || r.message) || r));
      });
    })();
    // Aberto com dois cliques (file://), o navegador bloqueia os módulos: avisa em vez de ficar em branco.
    if (location.protocol === 'file:') {
      document.body.innerHTML = '<div class="fail"><h1>Abra pelo Live Server</h1>' +
        '<p>O endereço precisa começar com <b>http://</b>. No VS Code, clique em <b>Go Live</b>.</p></div>';
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
